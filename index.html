<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nicolaus English Platform</title>
  <style>


@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --ink: #1C2541;
  --paper: #EFF1EA;
  --paper-dark: #E4E6DE;
  --gold: #B8860B;
  --sage: #5B7A63;
  --brick: #A8462F;
  --slate: #5C6478;
  --a1: #8B9A8C; --a2: #5B7A63; --b1: #B8860B; --b2: #A8752B; --c1: #A8462F; --c2: #1C2541;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  background: var(--paper);
  min-height: 100vh;
}
::selection { background: var(--gold); color: white; }
.serif { font-family: 'Newsreader', serif; }
.mono { font-family: 'IBM Plex Mono', monospace; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
a { color: inherit; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.anim { animation: fadeIn .35s ease both; }
@keyframes stampIn { 0% { transform: scale(1.4) rotate(-14deg); opacity: 0; } 60% { transform: scale(.95) rotate(-8deg); opacity: 1;} 100% { transform: scale(1) rotate(-6deg); opacity: 1; } }
.stamp-in { animation: stampIn .5s cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #C7CABD; border-radius: 3px; }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- Layout ---------- */
.center-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.app-shell { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: var(--ink); color: white; padding: 22px 16px; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; background: none; border: none; cursor: pointer; color: white; margin-bottom: 30px; padding: 0; }
.sidebar-nav { display: flex; flex-direction: column; gap: 3px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; background: transparent; border: none; color: white; cursor: pointer; font-size: 14px; font-weight: 500; text-align: left; }
.nav-item.active { background: rgba(255,255,255,.1); }
.sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.sidebar-footer button { display: flex; align-items: center; gap: 8px; background: none; border: none; color: rgba(255,255,255,.6); cursor: pointer; font-size: 13px; padding: 9px 12px; text-align: left; }
.main { flex: 1; padding: 30px 34px; max-width: 1180px; }
.student-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 30px; border-bottom: 1px solid var(--paper-dark); }
.student-header .links { display: flex; align-items: center; gap: 16px; }
.student-header button.linklike { display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; color: var(--slate); font-size: 13px; }
.student-main { padding: 34px 24px; max-width: 820px; margin: 0 auto; }

.page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
.page-header h2 { font-size: 26px; font-weight: 600; margin: 0; }
.page-header p { color: var(--slate); font-size: 13.5px; margin: 4px 0 0; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 26px; }
.kpi-card { background: white; border: 1px solid var(--paper-dark); border-radius: 14px; padding: 18px 20px; }
.kpi-card .kpi-label { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--slate); display: flex; align-items: center; justify-content: space-between; }
.kpi-card .kpi-value { font-family: 'Newsreader', serif; font-size: 28px; font-weight: 600; margin-top: 8px; }
.kpi-card .kpi-sub { font-size: 12.5px; color: var(--slate); margin-top: 4px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } .app-shell { flex-direction: column; } .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 14px 16px; } .sidebar-nav { flex-direction: row; flex-wrap: wrap; } .sidebar-footer { margin-top: 0; margin-left: auto; flex-direction: row; } .main { padding: 20px; } }

.panel { background: white; border: 1px solid var(--paper-dark); border-radius: 14px; padding: 18px; }
.panel-title { font-size: 11px; letter-spacing: .7px; text-transform: uppercase; color: var(--slate); display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--paper); gap: 10px; }
.row .row-left { font-size: 14px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .row-mid { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--slate); margin-left: auto; white-space: nowrap; }

.empty-state { text-align: center; padding: 44px 20px; color: var(--slate); }
.empty-state .empty-title { font-family: 'Newsreader', serif; font-size: 16px; color: var(--ink); margin: 8px 0 3px; }
.empty-state svg { opacity: .6; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 9px; cursor: pointer; border: none; background: var(--ink); color: white; transition: opacity .15s; }
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { font-size: 13px; padding: 7px 12px; }
.btn.gold { background: var(--gold); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--paper-dark); }
.btn.danger { background: transparent; color: var(--brick); border: 1px solid rgba(168,70,47,.3); }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--slate); padding: 4px; display: inline-flex; }
.icon-btn.danger { color: var(--brick); }

/* ---------- Forms ---------- */
.field { display: block; margin-bottom: 14px; }
.field-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--slate); display: block; margin-bottom: 5px; }
.input, select.input, textarea.input {
  width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--paper-dark);
  background: #FAFAF7; color: var(--ink); box-sizing: border-box;
}
textarea.input { resize: vertical; line-height: 1.6; }
.field-row { display: flex; gap: 10px; }
.field-row > * { flex: 1; }
.error-text { font-size: 12.5px; color: var(--brick); margin: -6px 0 12px; display: flex; align-items: center; gap: 6px; }
.hint-text { font-size: 11.5px; color: var(--slate); margin-top: -8px; margin-bottom: 4px; }

/* ---------- Pills / tags / badges ---------- */
.pill { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .4px; text-transform: uppercase; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; display: inline-block; }
.type-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; }
.chip { padding: 6px 13px; border-radius: 20px; border: 1px solid var(--paper-dark); background: white; color: var(--slate); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.chip.active { background: var(--ink); border-color: var(--ink); color: white; }
.chip.gold.active { background: rgba(184,134,11,.1); border-color: var(--gold); color: var(--gold); }

.stamp { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; transform: rotate(-6deg); position: relative; }
.stamp::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1px solid currentColor; opacity: .35; }
.stamp .stamp-level { font-family: 'Newsreader', serif; font-weight: 600; line-height: 1; }
.stamp .stamp-sub { font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; margin-top: 2px; }
.stamp.size-lg { width: 108px; height: 108px; border: 2.5px solid currentColor; }
.stamp.size-lg .stamp-level { font-size: 30px; }
.stamp.size-lg .stamp-sub { font-size: 9px; }
.stamp.size-md { width: 68px; height: 68px; border: 2.5px solid currentColor; }
.stamp.size-md .stamp-level { font-size: 22px; }
.stamp.size-md .stamp-sub { font-size: 7px; }
.stamp.size-sm { width: 42px; height: 42px; border: 2.5px solid currentColor; }
.stamp.size-sm .stamp-level { font-size: 15px; }
.stamp.na { border: 1.5px dashed var(--slate); color: var(--slate); font-family: 'IBM Plex Mono', monospace; font-size: 9px; text-align: center; padding: 4px; transform: none; }
.stamp.na::before { content: none; }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(28,37,65,.61); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: white; border-radius: 16px; width: 460px; max-width: 100%; max-height: 88vh; overflow-y: auto; padding: 26px; }
.modal.wide { width: 520px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-head h3 { font-family: 'Newsreader', serif; font-size: 20px; font-weight: 600; margin: 0; }
.modal-close { background: none; border: none; cursor: pointer; color: var(--slate); }

/* ---------- Landing ---------- */
.logo { border-radius: 50%; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; transform: rotate(-6deg); position: relative; flex-shrink: 0; }
.logo::before { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; border: 1px solid rgba(28,37,65,.35); }
.logo span { font-family: 'Newsreader', serif; font-weight: 600; color: var(--ink); }
.card-btn { display: flex; align-items: center; gap: 14px; background: white; border: 1px solid var(--paper-dark); border-radius: 16px; padding: 22px 24px; width: 330px; max-width: 100%; cursor: pointer; text-align: left; }
.icon-circle { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ---------- Auth shell ---------- */
.auth-box { width: 360px; max-width: 100%; }
.auth-panel { background: white; border: 1px solid var(--paper-dark); border-radius: 16px; padding: 24px; }

/* ---------- Tabs ---------- */
.tabbar { display: flex; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid var(--paper-dark); }
.tabbar button { padding: 9px 4px; margin-right: 18px; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--slate); border-bottom: 2px solid transparent; }
.tabbar button.active { color: var(--ink); border-bottom-color: var(--gold); }

/* ---------- Grids ---------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.student-card, .lesson-card { background: white; border: 1px solid var(--paper-dark); border-radius: 14px; padding: 16px; }
.student-card { padding: 18px; cursor: pointer; }

/* ---------- Progress / notices ---------- */
.progressbar { height: 4px; background: var(--paper-dark); border-radius: 3px; overflow: hidden; margin: 16px 0 22px; }
.progressbar-fill { height: 100%; background: var(--gold); transition: width .3s; }
.notice { border-radius: 14px; padding: 18px; margin-bottom: 24px; display: flex; align-items: center; gap: 14px; }
.notice.gold { background: white; border: 1.5px solid var(--gold); }
.notice.brick { background: rgba(168,70,47,.05); border: 1.5px solid rgba(168,70,47,.35); }
.notice.error { background: rgba(168,70,47,.05); border: 1px solid rgba(168,70,47,.35); color: var(--brick); font-size: 13.5px; padding: 14px; margin-top: 14px; }

.question-card { background: white; border: 1px solid var(--paper-dark); border-radius: 16px; padding: 26px; }
.option-btn { text-align: left; padding: 11px 14px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--paper-dark); background: white; font-size: 14.5px; width: 100%; display: block; margin-bottom: 8px; }
.option-btn.selected { border-color: var(--ink); background: rgba(28,37,65,.05); font-weight: 600; }
.option-btn:last-child { margin-bottom: 0; }

#app { min-height: 100vh; }
.small-muted { font-size: 12.5px; color: var(--slate); }
.mb-0 { margin-bottom: 0 !important; }

  
  
  </style>
</head>

function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const fmtBRL = (v) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(v || 0);
function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
}
const todayISO = () => new Date().toISOString().slice(0, 10);
function achievedLevel(lessonLevel, pct) {
  const idx = LEVELS_ORDER.indexOf(lessonLevel);
  if (pct >= 70) return lessonLevel;
  if (pct >= 40) return LEVELS_ORDER[Math.max(0, idx - 1)];
  return LEVELS_ORDER[Math.max(0, idx - 2)];
}

document.getElementById("app").addEventListener("click", async (e) => {

  if (!target) return;
  const action = target.dataset.action;
  const fn = actions[action];
  if (fn) { try { await fn(target.dataset, e); } catch (err) { console.error(err); } }
});

});

/* ============================== BOOT / AUTH ============================== */
async function init() {
  try {
    const dirSnap = await db.collection("directory").get();
    state.directory = dirSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) { state.directory = []; }
  try {
    const metaSnap = await db.collection("config").doc("meta").get();
    state.metaSetupComplete = metaSnap.exists && !!metaSnap.data().setupComplete;
  } catch (e) { state.metaSetupComplete = false; }

  auth.onAuthStateChanged(async (user) => {
    if (suppressAuthListener) return;
    await handleAuthChange(user);
  });

  if (!auth.currentUser) { state.view = "landing"; render(); }
}

async function handleAuthChange(user) {
  if (!user) {
    state.authUser = null; state.role = null; state.studentProfile = null;
    state.view = "landing";
    render();
    return;
  }
  state.authUser = user;
  const metaSnap = await db.collection("config").doc("meta").get();
  state.metaSetupComplete = metaSnap.exists;

  if (metaSnap.exists && metaSnap.data().professorUid === user.uid) {
    state.role = "professor";
    await loadAdminData();
    state.view = "admin";
    render();
    return;
  }

  const studentDoc = await db.collection("students").doc(user.uid).get();
  if (studentDoc.exists) {
    state.role = "student";
    state.studentProfile = { id: studentDoc.id, ...studentDoc.data() };
    await loadStudentData(user.uid);
    state.view = state.studentProfile.mustChangePassword ? "student-forceChange" : "student";
    render();
    return;
  }

  // Conta autenticada mas sem professor nem aluno correspondente no Firestore
  // (ex: aluno removido pelo professor) — desloga por segurança.
  state.role = null;
  state.formError = "Sua conta não está mais ativa. Fale com seu professor.";
  await auth.signOut();
  state.view = "landing";
  render();
}

async function loadAdminData() {
  const [studentsSnap, classesSnap, paymentsSnap, assignmentsSnap] = await Promise.all([
    db.collection("students").get(),
    db.collection("classes").get(),
    db.collection("payments").get(),
    db.collection("assignments").get(),
  ]);
  state.students = studentsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  state.classes = classesSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  state.payments = paymentsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  state.assignments = assignmentsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

async function loadStudentData(uid) {
  const [studentDoc, classesSnap, paymentsSnap, assignmentsSnap] = await Promise.all([
    db.collection("students").doc(uid).get(),
    db.collection("classes").where("studentId", "==", uid).get(),
    db.collection("payments").where("studentId", "==", uid).get(),
    db.collection("assignments").where("studentId", "==", uid).get(),
  ]);
  state.studentProfile = studentDoc.exists ? { id: studentDoc.id, ...studentDoc.data() } : null;
  state.classes = classesSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  state.payments = paymentsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
  state.assignments = assignmentsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

/**
 * Cria a conta de um aluno no Firebase Auth SEM deslogar o professor.
 * Técnica: inicializa uma segunda instância nomeada do app Firebase,
 * cria o usuário ali (isso "loga" só dentro dessa instância secundária,
 * nunca na instância principal onde o professor está autenticado),
 * desloga e destrói a instância secundária em seguida. 100% client-side,
 * funciona no plano gratuito (Spark) — não precisa de Admin SDK/servidor.
 */
async function createStudentAccount(name, email, password) {
  const secondaryApp = firebase.initializeApp(firebaseConfig, "secondary-" + Date.now());
  try {
    const secondaryAuth = secondaryApp.auth();
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    await secondaryAuth.signOut();
    const batch = db.batch();
    batch.set(db.collection("students").doc(uid), {
      name, email, phone: "", level: "", status: "ativo", testHistory: [],
      mustChangePassword: true, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    batch.set(db.collection("directory").doc(uid), { name, level: "", email });
    await batch.commit();
    return uid;
  } finally {
    await secondaryApp.delete();
  }
}

function friendlyAuthError(err) {
  const map = {
    "auth/wrong-password": "Senha incorreta.",
    "auth/user-not-found": "Conta não encontrada.",
    "auth/invalid-email": "E-mail inválido.",
    "auth/email-already-in-use": "Já existe uma conta com esse e-mail.",
    "auth/weak-password": "Senha muito fraca.",
    "auth/requires-recent-login": "Por segurança, confirme sua senha atual novamente.",
    "auth/invalid-credential": "Senha atual incorreta.",
  };
  return map[err.code] || err.message || "Ocorreu um erro. Tente novamente.";
}

async function completeExercise(lesson, outcome, assignmentId) {
  const uid = state.authUser.uid;
  if (assignmentId) {
    await db.collection("assignments").doc(assignmentId).update({
      status: "concluida", completedAt: todayISO(), score: outcome.score, resultLevel: outcome.resultLevel,
      feedback: outcome.feedback || "", responseText: outcome.responseText || "",
    });
  } else {
    await db.collection("assignments").add({
      studentId: uid, lessonId: lesson.id, lessonTitle: lesson.title, lessonType: lesson.type, lessonLevel: lesson.level,
      assignedBy: "aluno", assignedDate: todayISO(), dueDate: null,
      status: "concluida", completedAt: todayISO(),
      score: outcome.score, resultLevel: outcome.resultLevel, feedback: outcome.feedback || "", responseText: outcome.responseText || "",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }
  await loadStudentData(uid);
}

/**
 * Fluxo de redação sem IA: o aluno envia o texto e a atividade fica com
 * status "aguardando_correcao" até o professor ler e avaliar manualmente
 * (em Atividades → abrir a atividade → preencher nível/pontuação/feedback).
 */
async function submitWritingForReview(lesson, text, assignmentId) {
  const uid = state.authUser.uid;
  if (assignmentId) {
    await db.collection("assignments").doc(assignmentId).update({
      status: "aguardando_correcao", submittedAt: todayISO(), responseText: text,
    });
  } else {
    await db.collection("assignments").add({
      studentId: uid, lessonId: lesson.id, lessonTitle: lesson.title, lessonType: lesson.type, lessonLevel: lesson.level,
      assignedBy: "aluno", assignedDate: todayISO(), dueDate: null,
      status: "aguardando_correcao", submittedAt: todayISO(),
      score: null, resultLevel: null, feedback: "", responseText: text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }
  await loadStudentData(uid);
}

function studentNameOf(id) { const s = state.students.find((x) => x.id === id); return s ? s.name : "—"; }
function studentOf(id) { return state.students.find((x) => x.id === id); }

function renderAdminOverview() {
  const now = new Date();
  const monthKey = now.toISOString().slice(0, 7);
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0, 0, 0, 0);
  const endOfWeek = new Date(startOfWeek); endOfWeek.setDate(startOfWeek.getDate() + 7);

  const activeStudents = state.students.filter((s) => s.status !== "inativo").length;
  const monthRevenue = state.payments.filter((p) => p.status === "pago" && (p.date || "").startsWith(monthKey)).reduce((a, p) => a + Number(p.amount || 0), 0);
  const pending = state.payments.filter((p) => p.status !== "pago").reduce((a, p) => a + Number(p.amount || 0), 0);
  const weekClasses = state.classes.filter((c) => { const d = new Date(c.date + "T00:00:00"); return d >= startOfWeek && d < endOfWeek; }).length;
  const pendingTasks = state.assignments.filter((a) => a.status === "pendente").length;
  const awaitingReview = state.assignments.filter((a) => a.status === "aguardando_correcao").length;

  const recentClasses = [...state.classes].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 5);
  const recentAssignments = [...state.assignments].sort((a, b) => (b.completedAt || b.submittedAt || b.assignedDate || "").localeCompare(a.completedAt || a.submittedAt || a.assignedDate || "")).slice(0, 5);

  return `
    <div class="page-header"><div><h2 class="serif">Painel</h2><p>Visão geral da sua operação de ensino</p></div></div>
    <div class="kpi-grid">
      ${kpiCard("Alunos ativos", activeStudents)}
      ${kpiCard("Receita do mês", fmtBRL(monthRevenue), "var(--sage)")}
      ${kpiCard("Pendências", fmtBRL(pending), pending > 0 ? "var(--brick)" : "var(--sage)")}
      ${kpiCard("Aulas esta semana", weekClasses, "var(--gold)")}
      ${kpiCard("Tarefas pendentes", pendingTasks, pendingTasks > 0 ? "var(--brick)" : "var(--sage)")}
      ${kpiCard("Redações p/ corrigir", awaitingReview, awaitingReview > 0 ? "var(--brick)" : "var(--sage)")}
    </div>
    <div class="two-col">
      ${panel("Últimas aulas", recentClasses.length ? recentClasses.map((c) => rowHTML(studentNameOf(c.studentId), fmtDate(c.date), statusPill(c.status))).join("") : emptyState("Nenhuma aula ainda", "Agende a primeira aula na aba Aulas."))}
      ${panel("Atividades recentes", recentAssignments.length ? recentAssignments.map((a) => rowHTML(`${studentNameOf(a.studentId)} — ${a.lessonTitle}`, a.status === "concluida" ? (a.resultLevel || "") : "—", statusPill(a.status))).join("") : emptyState("Nenhuma atividade ainda", "Atribua um exercício na aba Atividades."))}
    </div>`;
}

function renderAdminFinanceiro() {
  const byMonth = {};
  state.payments.filter((p) => p.status === "pago").forEach((p) => {
    const k = (p.date || "").slice(0, 7);
    if (!k) return;
    byMonth[k] = (byMonth[k] || 0) + Number(p.amount || 0);
  });
  const months = Object.keys(byMonth).sort().slice(-6);
  const chartLabels = months.map((k) => new Date(k + "-02").toLocaleDateString("pt-BR", { month: "short" }));
  const chartValues = months.map((k) => byMonth[k]);

  const totalPago = state.payments.filter((p) => p.status === "pago").reduce((a, p) => a + Number(p.amount || 0), 0);
  const totalPendente = state.payments.filter((p) => p.status !== "pago").reduce((a, p) => a + Number(p.amount || 0), 0);
  const sorted = [...state.payments].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  return `
    <div class="page-header"><div><h2 class="serif">Financeiro</h2><p>Receita, pendências e histórico de pagamentos</p></div>
      <button class="btn" data-action="open-modal" data-type="payment">+ Novo pagamento</button></div>
    <div class="kpi-grid">
      ${kpiCard("Total recebido", fmtBRL(totalPago), "var(--sage)")}
      ${kpiCard("Total pendente", fmtBRL(totalPendente), totalPendente > 0 ? "var(--brick)" : "var(--sage)")}
    </div>
    ${panel("Receita mensal (pagamentos confirmados)", months.length
      ? `<div style="height:190px;margin-top:10px"><canvas data-chart="bar" data-labels='${esc(JSON.stringify(chartLabels))}' data-values='${esc(JSON.stringify(chartValues))}'></canvas></div>`
      : emptyState("Ainda sem dados suficientes", "O gráfico aparece assim que houver pagamentos confirmados."))}
    <div style="margin-top:20px">
      ${panel("Histórico de pagamentos", sorted.length ? sorted.map((p) => `
        <div class="row">
          <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${esc(studentNameOf(p.studentId))}</div>
          <div class="mono" style="font-size:11.5px;color:var(--slate);margin-top:2px">${fmtDate(p.date)} · ${esc(p.method)}${p.reference ? ` · ${esc(p.reference)}` : ""}</div></div>
          <span class="mono" style="font-size:14px;font-weight:600">${fmtBRL(p.amount)}</span>
          ${statusPill(p.status)}
          <button class="icon-btn" data-action="open-modal" data-type="payment" data-id="${p.id}">✎</button>
          <button class="icon-btn danger" data-action="delete-payment" data-id="${p.id}">🗑</button>
        </div>`).join("") : emptyState("Nenhum pagamento registrado", "Clique em “Novo pagamento” para começar."))}
    </div>`;
}

function renderAdminAlunos() {
  const q = state.studentSearch || "";
  const filtered = state.students.filter((s) => s.name.toLowerCase().includes(q.toLowerCase()));
  const pendingFor = (id) => state.assignments.filter((a) => a.studentId === id && a.status === "pendente").length;
  return `
    <div class="page-header"><div><h2 class="serif">Alunos</h2><p>Cadastro, nível e status de cada aluno</p></div>
      <button class="btn" data-action="open-modal" data-type="student">+ Novo aluno</button></div>
    <div class="field" style="max-width:320px"><input id="student-search-admin" class="input" placeholder="Buscar aluno…" value="${esc(q)}" /></div>
    ${filtered.length ? `<div class="card-grid">${filtered.map((s) => {
      const pend = pendingFor(s.id);
      return `<div class="student-card" data-action="open-student-detail" data-id="${s.id}">
        <div style="display:flex;align-items:center;gap:12px">
          ${stampHTML(s.level, "sm")}
          <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600">${esc(s.name)}</div><div style="font-size:12px;color:var(--slate);margin-top:2px">${s.level ? esc(LEVEL_NAMES[s.level]) : "Não avaliado"}</div></div>
          ${statusPill(s.status)}
        </div>
        ${pend > 0 ? `<div style="margin-top:10px">${pillHTML(`${pend} tarefa${pend > 1 ? "s" : ""} pendente${pend > 1 ? "s" : ""}`, "var(--brick)")}</div>` : ""}
        <div style="display:flex;justify-content:flex-end;gap:4px;margin-top:12px">
          <button class="icon-btn" data-action="open-modal" data-type="student" data-id="${s.id}" onclick="event.stopPropagation()">✎</button>
          <button class="icon-btn danger" data-action="delete-student" data-id="${s.id}" onclick="event.stopPropagation()">🗑</button>
        </div>
      </div>`;
    }).join("")}</div>` : emptyState("Nenhum aluno encontrado", "Cadastre um aluno para começar a acompanhar o progresso.")}`;
}

function renderStudentDetail() {
  const student = studentOf(state.detailStudentId);
  if (!student) return emptyState("Aluno não encontrado", "");
  const classes = state.classes.filter((c) => c.studentId === student.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const payments = state.payments.filter((p) => p.studentId === student.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const assignments = state.assignments.filter((a) => a.studentId === student.id).sort((a, b) => (b.completedAt || b.assignedDate || "").localeCompare(a.completedAt || a.assignedDate || ""));
  const completed = classes.filter((c) => c.status === "concluida").length;
  const pendingCount = assignments.filter((a) => a.status === "pendente").length;
  const history = student.testHistory || [];

  return `
    <button class="icon-btn" style="margin-bottom:14px;font-size:13px" data-action="back-to-students">← Voltar para alunos</button>
    <div style="display:flex;align-items:center;gap:18px;margin-bottom:26px;flex-wrap:wrap">
      ${stampHTML(student.level, "lg")}
      <div style="flex:1;min-width:200px"><h2 class="serif" style="font-size:26px;font-weight:600;margin:0">${esc(student.name)}</h2>
        <p style="color:var(--slate);font-size:13.5px;margin:4px 0 0">${esc(student.email || "sem e-mail")} · ${esc(student.phone || "sem telefone")} · ${completed} aula(s) concluída(s)</p></div>
      <button class="btn gold" data-action="open-modal" data-type="assignment" data-student="${student.id}">+ Atribuir exercício</button>
    </div>
    <div class="kpi-grid">
      ${kpiCard("Tarefas pendentes", pendingCount, pendingCount > 0 ? "var(--brick)" : "var(--sage)")}
      ${kpiCard("Tarefas concluídas", assignments.filter((a) => a.status === "concluida").length, "var(--sage)")}
      ${kpiCard("Tentativas de nivelamento", history.length, "var(--gold)")}
    </div>
    <div class="two-col">
      ${panel("Evolução no teste de nível", history.length ? `<div style="height:170px;margin-top:10px"><canvas data-chart="line" data-labels='${esc(JSON.stringify(history.map((_, i) => "#" + (i + 1))))}' data-values='${esc(JSON.stringify(history.map((h) => h.score)))}'></canvas></div>` : emptyState("Sem testes realizados", "O aluno ainda não fez o teste de nivelamento."))}
      ${panel("Pagamentos", payments.length ? payments.slice(0, 6).map((p) => rowHTML(fmtDate(p.date), fmtBRL(p.amount), statusPill(p.status))).join("") : emptyState("Sem pagamentos", "Nenhum pagamento registrado ainda."))}
    </div>
    <div style="margin-top:18px">
      ${panel("Atividades e exercícios", assignments.length ? assignments.map((a) => `
        <div class="row" style="cursor:pointer" data-action="open-modal" data-type="assignmentDetail" data-id="${a.id}">
          <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${esc(a.lessonTitle)}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:3px">${typeTagHTML(a.lessonType)}<span class="mono" style="font-size:11px;color:var(--slate)">${a.assignedBy === "professor" ? "atribuída" : "prática livre"} · ${fmtDate(a.assignedDate)}</span></div></div>
          ${a.status === "concluida" && a.resultLevel ? stampHTML(a.resultLevel, "sm") : ""}
          ${statusPill(a.status)}
        </div>`).join("") : emptyState("Nenhuma atividade", "Atribua um exercício ou aguarde a prática livre do aluno."))}
    </div>
    <div style="margin-top:18px">
      ${panel("Aulas", classes.length ? classes.map((c) => rowHTML(c.topic || "Aula", fmtDate(c.date), statusPill(c.status))).join("") : emptyState("Sem aulas", "Nenhuma aula agendada para este aluno."))}
    </div>`;
}

function renderAdminAtividades() {
  const statusFilter = state.assignStatusFilter || "todas";
  const studentFilter = state.assignStudentFilter || "todos";
  let list = [...state.assignments];
  if (statusFilter !== "todas") list = list.filter((a) => a.status === statusFilter);
  if (studentFilter !== "todos") list = list.filter((a) => a.studentId === studentFilter);
  list.sort((a, b) => { if (a.status !== b.status) return a.status === "pendente" ? -1 : 1; return (b.completedAt || b.assignedDate || "").localeCompare(a.completedAt || a.assignedDate || ""); });

  return `
    <div class="page-header"><div><h2 class="serif">Atividades</h2><p>O que foi passado, quem fez e em qual nível</p></div>
      <button class="btn" data-action="open-modal" data-type="assignment">+ Atribuir exercício</button></div>
    <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap">
      <div style="display:flex;gap:6px">
        ${["todas", "pendente", "aguardando_correcao", "concluida"].map((f) => `<button class="chip ${statusFilter === f ? "active" : ""}" data-action="set-assign-status-filter" data-f="${f}">${f === "todas" ? "Todas" : STATUS_META[f].label}</button>`).join("")}
      </div>
      <select id="assign-student-filter" class="input" style="width:auto" data-action-onchange="set-assign-student-filter">
        <option value="todos">Todos os alunos</option>
        ${state.students.map((s) => `<option value="${s.id}" ${studentFilter === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}
      </select>
    </div>
    ${list.length ? panel(`${list.length} atividade(s)`, list.map((a) => `
      <div class="row">
        <div style="flex:1;min-width:0;cursor:pointer" data-action="open-modal" data-type="assignmentDetail" data-id="${a.id}">
          <div style="font-size:14px;font-weight:600">${esc(studentNameOf(a.studentId))} — ${esc(a.lessonTitle)}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap">${typeTagHTML(a.lessonType)}<span class="mono" style="font-size:11px;color:var(--slate)">${a.assignedBy === "professor" ? "atribuída" : "prática livre"} · ${fmtDate(a.assignedDate)}${a.status === "concluida" ? ` · concluída em ${fmtDate(a.completedAt)}` : a.dueDate ? ` · prazo ${fmtDate(a.dueDate)}` : ""}</span></div>
        </div>
        ${a.status === "concluida" && a.resultLevel ? stampHTML(a.resultLevel, "sm") : ""}
        ${statusPill(a.status)}
        <button class="icon-btn" data-action="open-modal" data-type="assignmentDetail" data-id="${a.id}">👁</button>
        <button class="icon-btn danger" data-action="delete-assignment" data-id="${a.id}">🗑</button>
      </div>`).join("")) : emptyState("Nenhuma atividade encontrada", "Atribua um exercício a um aluno para começar a acompanhar.")}`;
}

function renderAdminAulas() {
  const filter = state.classFilter || "todas";
  const sorted = [...state.classes].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const filtered = filter === "todas" ? sorted : sorted.filter((c) => c.status === filter);
  return `
    <div class="page-header"><div><h2 class="serif">Aulas</h2><p>Agenda e histórico de aulas</p></div>
      <button class="btn" data-action="open-modal" data-type="class">+ Nova aula</button></div>
    <div style="display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap">
      ${["todas", "agendada", "concluida", "cancelada", "falta"].map((f) => `<button class="chip ${filter === f ? "active" : ""}" data-action="set-class-filter" data-f="${f}">${f === "todas" ? "Todas" : STATUS_META[f].label}</button>`).join("")}
    </div>
    ${filtered.length ? panel(`${filtered.length} aula(s)`, filtered.map((c) => `
      <div class="row">
        <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${esc(studentNameOf(c.studentId))} ${c.topic ? "— " + esc(c.topic) : ""}</div>
        <div class="mono" style="font-size:11.5px;color:var(--slate);margin-top:2px">${fmtDate(c.date)} ${c.time ? "· " + esc(c.time) : ""} ${c.duration ? "· " + c.duration + "min" : ""} ${c.price ? "· " + fmtBRL(c.price) : ""}</div></div>
        ${statusPill(c.status)}
        <button class="icon-btn" data-action="open-modal" data-type="class" data-id="${c.id}">✎</button>
        <button class="icon-btn danger" data-action="delete-class" data-id="${c.id}">🗑</button>
      </div>`).join("")) : emptyState("Nenhuma aula por aqui", "Ajuste o filtro ou agende uma nova aula.")}`;
}
Object.assign(actions, {
  "set-assign-status-filter": (ds) => { state.assignStatusFilter = ds.f; render(); },
  "set-class-filter": (ds) => { state.classFilter = ds.f; render(); },
});
document.getElementById("app").addEventListener("change", (e) => {
  if (e.target.id === "assign-student-filter") { state.assignStudentFilter = e.target.value; render(); }
  if (e.target.id === "student-search-admin") { state.studentSearch = e.target.value; render(); }
});

/* ============================== MODALS ============================== */
function renderModal() {
  const m = state.modal;
  let title = "", body = "", wide = false;
  if (m.type === "professorPw") { title = "Trocar senha"; body = professorPwForm(); }
  else if (m.type === "studentPw") { title = "Trocar senha"; body = studentPwForm(); }
  else if (m.type === "student") { title = m.id ? "Editar aluno" : "Novo aluno"; body = studentFormBody(); }
  else if (m.type === "class") { title = m.id ? "Editar aula" : "Nova aula"; body = classFormBody(); }
  else if (m.type === "payment") { title = m.id ? "Editar pagamento" : "Novo pagamento"; body = paymentFormBody(); }
  else if (m.type === "assignment") { title = "Atribuir exercício"; body = assignmentFormBody(); wide = true; }
  else if (m.type === "assignmentDetail") { title = "Detalhes da atividade"; body = assignmentDetailBody(); wide = true; }

  return `
  <div class="modal-overlay" data-action="close-modal-overlay" onclick="if(event.target===this) document.querySelector('[data-action=close-modal]')?.click()">
    <div class="modal ${wide ? "wide" : ""}" onclick="event.stopPropagation()">
      <div class="modal-head"><h3 class="serif">${esc(title)}</h3><button class="modal-close" data-action="close-modal">✕</button></div>
      ${body}
    </div>
  </div>`;
}

function professorPwForm() {
  return `
    <div class="field"><span class="field-label">Senha atual</span><input id="pw-current" type="password" class="input" /></div>
    <div class="field"><span class="field-label">Nova senha</span><input id="pw-new" type="password" class="input" /></div>
    <div class="field"><span class="field-label">Confirmar nova senha</span><input id="pw-confirm" type="password" class="input" /></div>
    ${state.formError ? `<p class="error-text">⚠ ${esc(state.formError)}</p>` : ""}
    <button class="btn gold" data-action="submit-professor-pw" ${state.busy ? "disabled" : ""}>${state.busy ? "Salvando…" : "Salvar nova senha"}</button>`;
}
function studentPwForm() {
  return `
    <div class="field"><span class="field-label">Senha atual</span><input id="spw-current" type="password" class="input" /></div>
    <div class="field"><span class="field-label">Nova senha</span><input id="spw-new" type="password" class="input" /></div>
    <div class="field"><span class="field-label">Confirmar nova senha</span><input id="spw-confirm" type="password" class="input" /></div>

}

      <select id="st-level" class="input">

        <option value="inativo" ${s.status === "inativo" ? "selected" : ""}>Inativo</option>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span style="font-size:13px;color:var(--slate)">Login: ${esc(s.email || "—")}</span>

        </div>
        <p class="hint-text">O aluno recebe um e-mail do Firebase com um link para criar uma nova senha.</p>` : `

    <div class="field"><span class="field-label">Status</span>
      <select id="cl-status" class="input">

    <div class="field"><span class="field-label">Aluno</span>
      <select id="pm-student" class="input">${state.students.map((s) => `<option value="${s.id}" ${p.studentId === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>

function assignmentFormBody() {

  return `
    <div class="field"><span class="field-label">Aluno</span>
      <select id="as-student" class="input">${state.students.map((s) => `<option value="${s.id}" ${preStudent === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
    <div class="field"><span class="field-label">Exercício</span>

function assignmentDetailBody() {
  const a = state.assignments.find((x) => x.id === state.modal.id);
  if (!a) return emptyState("Atividade não encontrada", "");
  let html = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">${typeTagHTML(a.lessonType)}${pillHTML(a.lessonLevel, LEVEL_VARS[a.lessonLevel])}${statusPill(a.status)}</div>
    <div style="font-size:13.5px;color:var(--slate);margin-bottom:4px"><strong style="color:var(--ink)">Aluno:</strong> ${esc(studentNameOf(a.studentId))}</div>
    <div style="font-size:13.5px;color:var(--slate);margin-bottom:4px"><strong style="color:var(--ink)">Atribuída por:</strong> ${a.assignedBy === "professor" ? "Professor" : "Prática livre do aluno"} em ${fmtDate(a.assignedDate)}</div>
    ${a.dueDate ? `<div style="font-size:13.5px;color:var(--slate);margin-bottom:4px"><strong style="color:var(--ink)">Prazo:</strong> ${fmtDate(a.dueDate)}</div>` : ""}`;
  if (a.status === "concluida") {
    html += `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--paper-dark)">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">${stampHTML(a.resultLevel, "md")}
        <div><div style="font-weight:600;font-size:15px">Nível atingido: ${esc(a.resultLevel)}</div>
        <div class="mono" style="font-size:12px;color:var(--slate)">${a.score != null ? `Pontuação: ${a.score}${a.lessonType === "escrita" ? "/100" : "%"} · ` : ""}concluída em ${fmtDate(a.completedAt)}</div></div></div>
      ${a.feedback ? `<div style="background:var(--paper);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.5;margin-bottom:${a.responseText ? "12px" : "0"}">${esc(a.feedback)}</div>` : ""}
      ${a.responseText ? `<div><span class="field-label">Texto do aluno</span><div style="margin-top:6px;background:#FAFAF7;border:1px solid var(--paper-dark);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap">${esc(a.responseText)}</div></div>` : ""}
    </div>`;
  } else if (a.status === "aguardando_correcao") {
    html += `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--paper-dark)">
      <span class="field-label">Texto do aluno</span>
      <div style="margin-top:6px;margin-bottom:16px;background:#FAFAF7;border:1px solid var(--paper-dark);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap">${esc(a.responseText || "")}</div>
      <div class="field"><span class="field-label">Nível atingido</span>
        <select id="grade-level" class="input">
          ${LEVELS_ORDER.map((l) => `<option value="${l}" ${l === a.lessonLevel ? "selected" : ""}>${l} — ${esc(LEVEL_NAMES[l])}</option>`).join("")}
        </select></div>
      <div class="field"><span class="field-label">Pontuação (0–100, opcional)</span><input id="grade-score" type="number" min="0" max="100" class="input" /></div>
      <div class="field"><span class="field-label">Feedback para o aluno</span><textarea id="grade-feedback" class="input" style="min-height:100px" placeholder="Comentário construtivo sobre a redação…"></textarea></div>
      ${state.formError ? `<p class="error-text">⚠ ${esc(state.formError)}</p>` : ""}
      <button class="btn gold" data-action="submit-grade" data-id="${a.id}" ${state.busy ? "disabled" : ""}>${state.busy ? "Salvando…" : "Salvar correção"}</button>
    </div>`;
  } else {
    html += `<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--paper-dark);font-size:13.5px;color:var(--slate)">Aguardando o aluno realizar esta atividade.</div>`;
  }
  return html;
}
Object.assign(actions, {
  "submit-grade": async (ds) => {
    const level = document.getElementById("grade-level").value;
    const scoreRaw = document.getElementById("grade-score").value;
    const feedback = document.getElementById("grade-feedback").value.trim();
    state.busy = true; render();
    try {
      await db.collection("assignments").doc(ds.id).update({
        status: "concluida", completedAt: todayISO(),
        resultLevel: level, score: scoreRaw === "" ? null : Number(scoreRaw), feedback,
      });
      await loadAdminData();
      state.busy = false; state.modal = null;
      render();
    } catch (err) { state.busy = false; state.formError = err.message; render(); }
  },
});

/* ============================== STUDENT APP ============================== */
function renderStudentApp() {
  const student = state.studentProfile;
  const myAssignments = state.assignments;
  const pendingTasksCount = myAssignments.filter((a) => a.assignedBy === "professor" && a.status === "pendente").length;

  let body = "";
  if (state.placementTest) body = renderPlacementTestView();
  else if (state.activeExercise) body = state.activeExercise.lesson.type === "escrita" ? renderWritingRunner() : renderExerciseRunner();
  else {
    const tabs = [
      { id: "inicio", label: "Início" },
      { id: "praticar", label: "Praticar" },
      { id: "tarefas", label: `Minhas tarefas${pendingTasksCount ? ` (${pendingTasksCount})` : ""}` },
    ];
    body = `<div class="tabbar">${tabs.map((t) => `<button class="${state.studentHomeTab === t.id ? "active" : ""}" data-action="student-tab" data-tab="${t.id}">${esc(t.label)}</button>`).join("")}</div>`;
    if (state.studentHomeTab === "inicio") body += renderStudentDashboard();
    else if (state.studentHomeTab === "praticar") body += renderPracticeLibrary();
    else if (state.studentHomeTab === "tarefas") body += renderMyTasks();
  }

  return `
  <div class="student-header">
    <div style="display:flex;align-items:center;gap:10px">${logoHTML(30)}<span class="serif" style="font-size:16px;font-weight:600">Nicolaus — Área do Aluno</span></div>
    <div class="links">
      <button class="linklike" data-action="open-modal" data-type="studentPw">Trocar senha</button>
      <button class="linklike" data-action="sign-out">Sair</button>
    </div>
  </div>
  <div class="student-main">${body}</div>`;
}

function renderStudentDashboard() {
  const student = state.studentProfile;
  const classes = [...state.classes].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const upcoming = classes.filter((c) => c.status === "agendada" && c.date >= todayISO()).slice(0, 3);
  const completedCount = classes.filter((c) => c.status === "concluida").length;
  const history = student.testHistory || [];
  const pendingTasks = state.assignments.filter((a) => a.assignedBy === "professor" && a.status === "pendente").length;
  const result = state.lastPlacementResult;

  return `
    ${result ? `<div class="notice gold anim">✨<div><div style="font-weight:600;font-size:14.5px">Teste concluído! Você atingiu o nível ${esc(result.level)}.</div><div style="font-size:12.5px;color:var(--slate)">Pontuação: ${result.score} de ${TEST_QUESTIONS.length}</div></div></div>` : ""}
    ${pendingTasks > 0 ? `<div class="notice brick anim">📋<span style="font-size:13.5px">Você tem <strong>${pendingTasks}</strong> tarefa${pendingTasks > 1 ? "s" : ""} pendente${pendingTasks > 1 ? "s" : ""} do seu professor. Veja em “Minhas tarefas”.</span></div>` : ""}
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px;flex-wrap:wrap">
      ${stampHTML(student.level, "lg")}
      <div><h2 class="serif" style="font-size:24px;font-weight:600;margin:0">Olá, ${esc((student.name || "").split(" ")[0])}</h2>
        <p style="color:var(--slate);font-size:13.5px;margin:4px 0 10px">${student.level ? `Nível atual: ${student.level} — ${esc(LEVEL_NAMES[student.level])}` : "Você ainda não fez o teste de nivelamento."}</p>
        <button class="btn ${student.level ? "ghost" : "gold"}" data-action="start-placement-test">${student.level ? "Refazer teste de nível" : "Fazer teste de nivelamento"}</button></div>
    </div>
    <div class="kpi-grid">
      ${kpiCard("Aulas concluídas", completedCount, "var(--sage)")}
      ${kpiCard("Exercícios concluídos", state.assignments.filter((a) => a.status === "concluida").length, "var(--gold)")}
      ${kpiCard("Próximas aulas", upcoming.length)}
    </div>
    <div class="two-col">
      ${panel("Sua evolução no nivelamento", history.length >= 2 ? `<div style="height:170px;margin-top:10px"><canvas data-chart="line" data-labels='${esc(JSON.stringify(history.map((_, i) => "#" + (i + 1))))}' data-values='${esc(JSON.stringify(history.map((h) => h.score)))}'></canvas></div>` : emptyState("Continue evoluindo", "Refaça o teste periodicamente para ver seu progresso aqui."))}
      ${panel("Próximas aulas", upcoming.length ? upcoming.map((c) => rowHTML(c.topic || "Aula", `${fmtDate(c.date)} ${c.time || ""}`)).join("") : emptyState("Nada agendado", "Fale com seu professor para marcar a próxima aula."))}
    </div>`;
}

function renderPracticeLibrary() {
  const typeFilter = state.practiceTypeFilter || "todos";
  const levelFilter = state.practiceLevelFilter || (state.studentProfile.level || "todos");
  const myAttempts = state.assignments.filter((a) => a.status === "concluida" || a.status === "aguardando_correcao");
  const bestFor = (lessonId) => myAttempts.filter((a) => a.lessonId === lessonId).sort((a, b) => (b.completedAt || b.submittedAt || "").localeCompare(a.completedAt || a.submittedAt || ""))[0];
  const filtered = LESSON_BANK.filter((l) => (typeFilter === "todos" || l.type === typeFilter) && (levelFilter === "todos" || l.level === levelFilter));

  return `
    <p style="color:var(--slate);font-size:13.5px;margin-bottom:16px">Escolha o nível e o tipo de exercício. Você pode praticar quantas vezes quiser.</p>
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
      ${[["todos", "Todos"], ["gramatica", "Gramática"], ["pratica", "Prática"], ["escrita", "Escrita"]].map(([id, label]) => `<button class="chip ${typeFilter === id ? "active" : ""}" data-action="set-practice-type" data-v="${id}">${label}</button>`).join("")}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap">
      ${["todos", ...LEVELS_ORDER].map((l) => `<button class="chip gold ${levelFilter === l ? "active" : ""}" data-action="set-practice-level" data-v="${l}">${l === "todos" ? "Todos" : l}</button>`).join("")}
    </div>
    <div class="lesson-grid">
      ${filtered.map((l) => {
        const best = bestFor(l.id);
        const badge = best && best.status === "aguardando_correcao"
          ? `<span class="mono" style="font-size:11px;color:var(--gold)">Aguardando correção</span>`
          : best ? `<span class="mono" style="font-size:11px;color:var(--sage)">Último: ${esc(best.resultLevel)}${best.score != null ? ` · ${best.score}${l.type === "escrita" ? "" : "%"}` : ""}</span>` : "";
        return `<div class="lesson-card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">${typeTagHTML(l.type)}${pillHTML(l.level, LEVEL_VARS[l.level])}</div>
          <div style="font-weight:600;font-size:15px;margin-bottom:3px">${esc(l.title)}</div>
          <div style="font-size:12.5px;color:var(--slate);margin-bottom:14px">${esc(l.description)}</div>
          ${best ? `<div style="display:flex;align-items:center;justify-content:space-between">
              ${badge}
              <button class="btn small ghost" data-action="start-lesson" data-lesson-id="${l.id}">Refazer</button></div>`
            : `<button class="btn small gold" data-action="start-lesson" data-lesson-id="${l.id}">Começar</button>`}
        </div>`;
      }).join("")}
    </div>`;
}
Object.assign(actions, {
  "set-practice-type": (ds) => { state.practiceTypeFilter = ds.v; render(); },
  "set-practice-level": (ds) => { state.practiceLevelFilter = ds.v; render(); },
});

function renderMyTasks() {
  const assignments = state.assignments.filter((a) => a.assignedBy === "professor");
  const pending = assignments.filter((a) => a.status === "pendente").sort((a, b) => (a.dueDate || a.assignedDate || "").localeCompare(b.dueDate || b.assignedDate || ""));
  const awaiting = assignments.filter((a) => a.status === "aguardando_correcao").sort((a, b) => (b.submittedAt || "").localeCompare(a.submittedAt || ""));
  const done = assignments.filter((a) => a.status === "concluida").sort((a, b) => (b.completedAt || "").localeCompare(a.completedAt || ""));
  return `
    ${panel(`Pendentes (${pending.length})`, pending.length ? pending.map((a) => `
      <div class="row"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(a.lessonTitle)}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap">${typeTagHTML(a.lessonType)}${pillHTML(a.lessonLevel, LEVEL_VARS[a.lessonLevel])}${a.dueDate ? `<span class="mono" style="font-size:11px;color:var(--slate)">prazo ${fmtDate(a.dueDate)}</span>` : ""}</div></div>
        <button class="btn small gold" data-action="start-lesson" data-lesson-id="${a.lessonId}" data-assignment-id="${a.id}">Fazer agora</button></div>`).join("")
      : emptyState("Tudo em dia!", "Nenhuma tarefa pendente do seu professor no momento."))}
    ${awaiting.length ? `<div style="margin-top:18px">${panel(`Aguardando correção do professor (${awaiting.length})`, awaiting.map((a) => `
      <div class="row"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(a.lessonTitle)}</div>${typeTagHTML(a.lessonType)}</div>
      ${statusPill(a.status)}</div>`).join(""))}</div>` : ""}
    <div style="margin-top:18px">
      ${panel(`Concluídas (${done.length})`, done.length ? done.map((a) => `
        <div class="row"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(a.lessonTitle)}</div>${typeTagHTML(a.lessonType)}</div>
        ${a.resultLevel ? stampHTML(a.resultLevel, "sm") : ""}</div>`).join("")
        : emptyState("Nenhuma tarefa concluída ainda", "Suas tarefas concluídas aparecerão aqui."))}
    </div>`;
}

/* ---------- Placement test ---------- */
function renderPlacementTestView() {
  const t = state.placementTest;
  const q = TEST_QUESTIONS[t.qIndex];
  const isLast = t.qIndex === TEST_QUESTIONS.length - 1;
  const picked = t.answers[t.qIndex];
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span class="mono" style="font-size:11.5px;color:var(--slate)">QUESTÃO ${t.qIndex + 1} DE ${TEST_QUESTIONS.length}</span>
      <button class="icon-btn" style="font-size:12.5px" data-action="cancel-placement-test">Cancelar</button>
    </div>
    <div class="progressbar"><div class="progressbar-fill" style="width:${((t.qIndex + 1) / TEST_QUESTIONS.length) * 100}%"></div></div>
    <div class="question-card">
      <p class="serif" style="font-size:20px;font-weight:500;margin-bottom:22px">${esc(q.q)}</p>
      ${q.opts.map((opt, i) => `<button class="option-btn ${picked === i ? "selected" : ""}" data-action="placement-pick-option" data-qindex="${t.qIndex}" data-optindex="${i}">${esc(opt)}</button>`).join("")}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:20px">
      <button class="btn ghost" data-action="placement-nav" data-dir="prev" ${t.qIndex === 0 ? "disabled" : ""}>Anterior</button>
      ${isLast ? `<button class="btn gold" data-action="placement-submit" ${picked === undefined ? "disabled" : ""}>Finalizar teste</button>` : `<button class="btn" data-action="placement-nav" data-dir="next" ${picked === undefined ? "disabled" : ""}>Próxima</button>`}
    </div>`;
}

/* ---------- Exercise runner (gramática / prática) ---------- */
function renderExerciseRunner() {
  const ex = state.activeExercise;
  const lesson = ex.lesson;
  const questions = lesson.questions;
  const q = questions[ex.qIndex];
  const isLast = ex.qIndex === questions.length - 1;
  const picked = ex.answers[ex.qIndex];
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div>${typeTagHTML(lesson.type)}<span class="mono" style="font-size:11px;color:var(--slate);margin-left:10px">${esc(lesson.title)} · Nível ${lesson.level}</span></div>
      <button class="icon-btn" style="font-size:12.5px" data-action="cancel-exercise">Cancelar</button>
    </div>
    ${lesson.type === "pratica" ? `<div class="panel anim" style="margin:16px 0;font-size:14px;line-height:1.6">${esc(lesson.text)}</div>` : ""}
    <div class="progressbar"><div class="progressbar-fill" style="width:${((ex.qIndex + 1) / questions.length) * 100}%"></div></div>
    <div class="question-card">
      <span class="mono" style="font-size:11px;color:var(--slate)">QUESTÃO ${ex.qIndex + 1} DE ${questions.length}</span>
      <p class="serif" style="font-size:19px;font-weight:500;margin:10px 0 20px">${esc(q.q)}</p>
      ${q.opts.map((opt, i) => `<button class="option-btn ${picked === i ? "selected" : ""}" data-action="exercise-pick-option" data-qindex="${ex.qIndex}" data-optindex="${i}">${esc(opt)}</button>`).join("")}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:20px">
      <button class="btn ghost" data-action="exercise-nav" data-dir="prev" ${ex.qIndex === 0 ? "disabled" : ""}>Anterior</button>
      ${isLast ? `<button class="btn gold" data-action="exercise-finish" ${picked === undefined ? "disabled" : ""}>Finalizar</button>` : `<button class="btn" data-action="exercise-nav" data-dir="next" ${picked === undefined ? "disabled" : ""}>Próxima</button>`}
    </div>`;
}

/* ---------- Writing runner (sem IA — revisão manual do professor) ---------- */
function renderWritingRunner() {
  const ex = state.activeExercise;
  const lesson = ex.lesson;
  if (ex.writingStatus === "sent") {
    return `<div class="panel anim" style="border:1.5px solid var(--gold);text-align:center;padding:26px">
      <div style="display:flex;justify-content:center;margin-bottom:14px">${stampHTML(null, "lg")}</div>
      <h3 class="serif" style="font-size:21px;font-weight:600;margin:0 0 6px">Redação enviada!</h3>
      <p style="color:var(--slate);font-size:13.5px;margin-bottom:18px">Seu professor vai ler e avaliar. Você verá o resultado em <strong>Minhas tarefas</strong>.</p>
      <button class="btn gold" data-action="writing-done">Concluir</button>
    </div>`;
  }
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>${typeTagHTML(lesson.type)}<span class="mono" style="font-size:11px;color:var(--slate);margin-left:10px">${esc(lesson.title)} · Nível ${lesson.level}</span></div>
      <button class="icon-btn" style="font-size:12.5px" data-action="cancel-exercise" ${state.busy ? "disabled" : ""}>Cancelar</button>
    </div>
    <div class="panel">
      <p class="serif" style="font-size:18px;font-weight:500;margin-bottom:16px;line-height:1.5">${esc(lesson.prompt)}</p>
      <textarea id="writing-text" class="input" placeholder="Escreva sua resposta em inglês aqui…" style="min-height:220px" ${state.busy ? "disabled" : ""}>${esc(ex.writingText || "")}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
        <span class="mono small-muted">${lesson.minWords ? `mínimo recomendado: ${lesson.minWords} palavras` : ""}</span>
      </div>
    </div>
    <p class="hint-text" style="margin-top:14px">Sua redação será enviada para o professor avaliar — não há correção automática.</p>
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button class="btn gold" data-action="writing-submit" ${state.busy ? "disabled" : ""}>${state.busy ? "Enviando…" : "Enviar para o professor"}</button>
    </div>`;
}

/* ============================== CHARTS ============================== */
const chartInstances = {};
function renderChart(canvas) {
  const type = canvas.dataset.chart;
  const labels = JSON.parse(canvas.dataset.labels || "[]");
  const values = JSON.parse(canvas.dataset.values || "[]");
  const key = canvas.dataset.chart + labels.join(",");
  if (chartInstances[key]) chartInstances[key].destroy();
  chartInstances[key] = new Chart(canvas, {
    type: type === "bar" ? "bar" : "line",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: "rgba(184,134,11,0.85)",
        borderColor: "#B8860B",
        borderWidth: type === "bar" ? 0 : 2.5,
        borderRadius: type === "bar" ? 5 : 0,
        tension: 0.3,
        pointBackgroundColor: "#B8860B",
        pointRadius: type === "bar" ? 0 : 4,
        fill: false,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, grid: { color: "#E4E6DE" } }, x: { grid: { display: false } } },
    },
  });
}

init();

  
  
  </script>
</body>
